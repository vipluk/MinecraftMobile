events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        listen [::]:80;
        server_name pearium.com www.pearium.com;

        # Katalog ze stroną WWW
        root /var/www/pearium;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Podgląd statusu serwera Minecraft dla przeglądarki
        location /api/status {
            proxy_pass http://127.0.0.1:7500/api/status;
            proxy_set_header Host $host;
        }
    }
}

# Moduł Stream do przekierowywania ruchu Minecraft TCP (jeśli nie bindowany bezpośrednio przez FRP)
stream {
    upstream minecraft_backend {
        server 127.0.0.1:25566; # Port wewnętrzny FRP
    }

    server {
        listen 25565;
        proxy_pass minecraft_backend;
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
